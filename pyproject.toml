[project]
name = "voynich-attack"
version = "0.1.0"
description = "Voynich manuscript analysis tools"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "IPython",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["voynpy*"]
